[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "opendirector-core"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7", "filelock>=3.16,<4", "httpx>=0.27,<1", "anyio>=4,<5", "pydantic>=2,<3", "typer>=0.27.3,<0.28", "Pillow>=12,<14"]

[project.scripts]
opendirector = "opendirector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

